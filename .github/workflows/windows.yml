name: Windows build
on:
  push:
    paths: ['windows/**', 'Sources/Catalog.swift', '.github/workflows/windows.yml', 'pytest.ini']
  pull_request:
    paths: ['windows/**', 'Sources/Catalog.swift', '.github/workflows/windows.yml', 'pytest.ini']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: windows/requirements-lock.txt
      - name: Prepare media test backend
        shell: powershell
        run: choco install ffmpeg --no-progress --yes
      - name: Build and test
        shell: powershell
        run: .\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FormatWheel-Windows-x64
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
